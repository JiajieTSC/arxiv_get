name: Daily arXiv Update

on:
  schedule:
    - cron: '0 1 * * *' # 每天北京时间早上 9:00 运行
  workflow_dispatch:      # 允许手动点击按钮运行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install arxiv requests

      - name: Run Scraper
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 需要在仓库 Settings -> Secrets 中设置
        run: python arxiv_bot.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # 部署当前目录下的 index.html